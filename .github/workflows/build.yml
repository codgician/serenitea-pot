name: build
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  repository_dispatch:
    types: [build]
  workflow_dispatch:
# Limit one run for each branch for saving resources
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.get_matrix.outputs.darwin }}
      linux: ${{ steps.get_matrix.outputs.linux }}
    steps:
      - uses: thiagokokada/free-disk-space@main
        continue-on-error: true
        with:
          python: false
          tool-cache: true
          usrlocal: true
          usrmisc: true
          opt: true
          varcache: true
      - name: Checkout new change
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            builders-use-substitutes = true
            system-features = nixos-test benchmark big-parallel kvm
      - name: Setup Attic cache
        if: github.ref == 'refs/heads/main'
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.codgician.me
          cache: serenitea-pot
          token: ${{ secrets.CACHE_PUSH_TOKEN }}
          inputs-from: .
      - name: Check flake
        run: nix flake check
      - name: Calculate strategy matrix
        id: get_matrix
        run: |
          linux=$(nix eval .\#nixosConfigurations --raw \
            --apply "x: builtins.toJSON (map (y: { name = y; system = x.\${y}.pkgs.stdenv.hostPlatform.system; }) (builtins.attrNames x))")
          darwin=$(nix eval .\#darwinConfigurations --raw \
            --apply "x: builtins.toJSON (map (y: { name = y; system = x.\${y}.pkgs.stdenv.hostPlatform.system; }) (builtins.attrNames x))")
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "darwin=$darwin" >> "$GITHUB_OUTPUT"
  build-linux:
    needs: validate
    strategy:
      matrix:
        host: ${{ fromJson(needs.validate.outputs.linux) }}
      fail-fast: false
    runs-on: ${{ matrix.host.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: thiagokokada/free-disk-space@main
        continue-on-error: true
        with:
          python: false
          tool-cache: true
          usrlocal: true
          usrmisc: true
          opt: true
          varcache: true
          debug: true
      - name: Checkout new change
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            auto-optimise-store = true
            experimental-features = nix-command flakes
            builders-use-substitutes = true
      - name: Setup Attic cache
        if: github.ref == 'refs/heads/main'
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.codgician.me
          cache: serenitea-pot
          token: ${{ secrets.CACHE_PUSH_TOKEN }}
          inputs-from: .
      - name: Build
        run: |
          nix build .#nixosConfigurations.${{ matrix.host.name }}.config.system.build.toplevel
  build-darwin:
    needs: validate
    runs-on: macos-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.validate.outputs.darwin) }}
      fail-fast: false
    steps:
      - name: Checkout new change
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            builders-use-substitutes = true
            extra-platforms = x86_64-darwin
      - name: Setup Attic cache
        if: github.ref == 'refs/heads/main'
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://cache.codgician.me
          cache: serenitea-pot
          token: ${{ secrets.CACHE_PUSH_TOKEN }}
          inputs-from: .
      - name: Build
        run: |
          nix build .#darwinConfigurations.${{ matrix.host.name }}.config.system.build.toplevel
